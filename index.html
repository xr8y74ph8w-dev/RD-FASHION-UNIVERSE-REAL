<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RD Fashion Universe — Wear Your Identity</title>
    <meta name="description" content="Premium fashion curated for the way you move, think and express yourself. Shop the latest drops from RD Fashion Universe." />
    <meta name="theme-color" content="#0a0a0a" />
    <link rel="preconnect" href="https://images.unsplash.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html { scroll-behavior: smooth; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
      html, body { margin: 0; padding: 0; width: 100%; min-height: 100%; background: #0a0a0a; color: #fff; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
      body { overflow-x: hidden; }
      img { max-width: 100%; display: block; }
      button { cursor: pointer; border: none; background: none; color: inherit; font: inherit; }
      input, select, textarea { font: inherit; }
      ::selection { background: #fff; color: #000; }
      /* Smooth scroll for all elements */
      * { scroll-behavior: smooth; }
      /* Prevent layout shift */
      [data-ratio] { aspect-ratio: attr(data-ratio); }
      /* Loading state */
      #root { min-height: 100vh; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
